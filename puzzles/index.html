<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.peerjs.com wss://*.peerjs.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puzzles — LocalChess</title>
  <link rel="stylesheet" href="../assets/chess-app/board.css" />
  <link rel="stylesheet" href="../assets/chess-app/puzzles.css" />
  <link rel="icon" type="image/x-icon" href="../assets/chess-app/favicon.ico" />
</head>
<body>

  <!-- ═══ Left sidebar ═══ -->
  <aside class="sidebar">
    <a class="side-logo" href="../"><span class="brand-mark">♞</span> LocalChess</a>
    <nav class="side-nav">
      <a href="./" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3.4"/><path d="M9.6 10.8 8.2 16.5h7.6l-1.4-5.7"/><path d="M6.2 20h11.6"/></svg></span> Play</a>
      <a href="../puzzles/" class="side-link active"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h3.2a1.9 1.9 0 1 1 3.6 0H18a1 1 0 0 1 1 1v3.2a1.9 1.9 0 1 0 0 3.6V17a1 1 0 0 1-1 1h-3.2a1.9 1.9 0 1 1-3.6 0H8a1 1 0 0 1-1-1v-3.2a1.9 1.9 0 1 0 0-3.6V5a1 1 0 0 1 1-1z"/></svg></span> Puzzles</a>
      <a href="../analysis/" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v15a1 1 0 0 0 1 1h15"/><path d="m7.5 14.5 3.5-3.5 2.5 2.5 5-5"/><path d="M15.5 8.5h3v3"/></svg></span> Analysis</a>
    </nav>
  </aside>

  <!-- ═══ Puzzle trainer screen ═══ -->
  <main class="screen active play-layout">

    <section class="board-stage">
      <div id="plate-top" class="nameplate"></div>
      <div id="board-mount"></div>
      <div class="nav-bar">
        <button id="btn-hint" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.4 17.5v-1.2c0-1.1-.5-2-1.3-2.9a5.5 5.5 0 1 1 7.8-.1c-.8.9-1.4 1.9-1.4 3v1.2"/><path d="M9.4 17.5h5.2"/><path d="M10.4 20.5h3.2"/></svg> Hint</button>
        <button id="btn-retry" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.8 13.2A7.5 7.5 0 1 0 6.2 7L4 9.6"/></svg> Retry</button>
        <button id="btn-prev" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg> Prev</button>
        <button id="btn-next" type="button">Next <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></button>
      </div>
      <div class="kb-hints">
        <kbd>←</kbd><kbd>→</kbd> puzzle · <kbd>H</kbd> hint · <kbd>R</kbd> retry
      </div>
    </section>

    <aside class="bot-panel">
      <div class="panel-head"><span class="panel-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h3.2a1.9 1.9 0 1 1 3.6 0H18a1 1 0 0 1 1 1v3.2a1.9 1.9 0 1 0 0 3.6V17a1 1 0 0 1-1 1h-3.2a1.9 1.9 0 1 1-3.6 0H8a1 1 0 0 1-1-1v-3.2a1.9 1.9 0 1 0 0-3.6V5a1 1 0 0 1 1-1z"/></svg></span> Puzzle Trainer</div>

      <div id="pz-status" class="game-status">Loading…</div>

      <div class="panel-section pz-progress">
        <div class="pz-progress-row">
          <span class="panel-label">Progress</span>
          <span id="pz-progress-count" class="pz-progress-count">0 / 0 solved</span>
        </div>
        <div class="progress-track">
          <div id="pz-progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="panel-section">
        <div class="pz-chip-row">
          <span id="pz-theme" class="pz-chip">—</span>
          <span id="pz-rating" class="pz-chip rating">—</span>
          <span id="pz-counter" class="muted"></span>
        </div>
        <div id="pz-desc" class="muted"></div>
        <div id="pz-message" class="pz-msg"></div>
        <div id="pz-success" class="pz-success">
          <div class="pz-check">✔</div>
          <div id="pz-success-title" class="pz-s-title">Puzzle solved!</div>
          <div id="pz-success-sub" class="pz-s-sub"></div>
        </div>
      </div>

      <div class="panel-section">
        <div class="acc-grid">
          <div class="acc-card">
            <span class="acc-side">Solved</span>
            <span id="pz-score" class="acc-value">0</span>
          </div>
          <div class="acc-card">
            <span class="acc-side">Total</span>
            <span id="pz-total" class="acc-value">0</span>
          </div>
        </div>
        <div class="panel-actions">
          <button id="btn-reset-score" type="button" class="btn-ghost">Reset score</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Puzzle list</div>
        <div id="pz-list" class="pz-list"></div>
      </div>
    </aside>

  </main>

  <!-- chess.js CJS shim → window.Chess -->
    <script src="../assets/chess-app/shim-pre.js"></script>
  <script src="../assets/vendor/chess.js"></script>
    <script src="../assets/chess-app/shim-post.js"></script>

  <script src="../assets/chess-app/board-ui.js"></script>
  <script src="../assets/chess-app/trainer.js"></script>

  <script src="../assets/chess-app/puzzles-page.js"></script>

</body>
</html>
