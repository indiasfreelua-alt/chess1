<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Review — Local Chess</title>
  <link rel="stylesheet" href="../assets/chess-app/board.css" />
  <link rel="stylesheet" href="../assets/chess-app/analysis.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23312e2b%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2210.5%22%20r%3D%224%22%20fill%3D%22%23f0d9b5%22%2F%3E%3Cpath%20d%3D%22M12.2%2015h7.6c1.5%203.6%202.4%207.2%202.7%2010.5H9.5c.3-3.3%201.2-6.9%202.7-10.5z%22%20fill%3D%22%23f0d9b5%22%2F%3E%3Crect%20x%3D%228.5%22%20y%3D%2225.5%22%20width%3D%2215%22%20height%3D%222.5%22%20rx%3D%221%22%20fill%3D%22%23f0d9b5%22%2F%3E%3C%2Fsvg%3E" />
</head>
<body>

  <!-- ═══ Left sidebar ═══ -->
  <aside class="sidebar">
    <a class="side-logo" href="../"><span class="brand-mark">♞</span> LocalChess</a>
    <nav class="side-nav">
      <a href="./" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3.4"/><path d="M9.6 10.8 8.2 16.5h7.6l-1.4-5.7"/><path d="M6.2 20h11.6"/></svg></span> Play</a>
      <a href="../puzzles/" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h3.2a1.9 1.9 0 1 1 3.6 0H18a1 1 0 0 1 1 1v3.2a1.9 1.9 0 1 0 0 3.6V17a1 1 0 0 1-1 1h-3.2a1.9 1.9 0 1 1-3.6 0H8a1 1 0 0 1-1-1v-3.2a1.9 1.9 0 1 0 0-3.6V5a1 1 0 0 1 1-1z"/></svg></span> Puzzles</a>
      <a href="../analysis/" class="side-link active"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v15a1 1 0 0 0 1 1h15"/><path d="m7.5 14.5 3.5-3.5 2.5 2.5 5-5"/><path d="M15.5 8.5h3v3"/></svg></span> Analysis</a>
    </nav>
    <button class="sound-toggle" type="button" title="Mute sound"></button>
  </aside>

  <main class="screen active play-layout">

    <!-- ═══ Board column ═══ -->
    <section class="board-stage">
      <div id="plate-top" class="nameplate">
        <span id="plate-top-avatar" class="plate-avatar">♚</span>
        <span id="plate-top-name">Black</span>
        <small id="plate-top-acc"></small>
      </div>
      <div id="board-mount"></div>
      <div id="plate-bottom" class="nameplate">
        <span id="plate-bottom-avatar" class="plate-avatar">♔</span>
        <span id="plate-bottom-name">White</span>
        <small id="plate-bottom-acc"></small>
      </div>
      <div class="nav-bar">
        <button id="btn-first" title="First (Home)" aria-label="First move"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 5.5-6.5 6.5 6.5 6.5"/><path d="M7.5 5.5v13"/></svg></button>
        <button id="btn-prev" title="Previous (←)" aria-label="Previous move"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg></button>
        <button id="btn-next" title="Next (→)" aria-label="Next move"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></button>
        <button id="btn-last" title="Last (End)" aria-label="Last move"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5.5 6.5 6.5L8 18.5"/><path d="M16.5 5.5v13"/></svg></button>
        <button id="btn-flip" title="Flip board (F)" aria-label="Flip board"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4.5v13"/><path d="m5 14.5 3 3 3-3"/><path d="M16 19.5v-13"/><path d="m13 9.5 3-3 3 3"/></svg></button>
      </div>
    </section>

    <!-- ═══ Review panel ═══ -->
    <aside class="bot-panel wide analysis-panel">

      <div class="panel-head"><span class="panel-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v15a1 1 0 0 0 1 1h15"/><path d="m7.5 14.5 3.5-3.5 2.5 2.5 5-5"/><path d="M15.5 8.5h3v3"/></svg></span> Game Review</div>

      <div id="review-line" class="review-line hidden"></div>
      <div id="opening-name" class="opening-name hidden"></div>

      <div class="panel-section">
        <label class="panel-label" for="game-select">Saved game</label>
        <select id="game-select"></select>
        <label class="panel-label" for="pgn-input">Paste PGN or FEN</label>
        <textarea id="pgn-input" rows="3" placeholder="1. e4 e5 2. Nf3 …"></textarea>
        <div class="panel-actions">
          <button id="btn-load-pgn">Load</button>
          <button id="btn-analyze" class="primary" disabled>Analyze</button>
        </div>
        <div id="load-status" class="load-status"></div>
        <div class="progress-row">
          <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
        <div class="depth-row">
          <label class="panel-label" for="depth-select">Engine depth</label>
          <select id="depth-select">
            <option value="100">Fast · 100 ms</option>
            <option value="250" selected>Standard · 250 ms</option>
            <option value="600">Deep · 600 ms</option>
          </select>
        </div>
      </div>

      <div id="summary" class="panel-section hidden">
        <div class="acc-grid">
          <div class="acc-card">
            <span class="acc-side">White</span>
            <span id="acc-w" class="acc-value">—</span>
            <div id="counts-w" class="cls-chips"></div>
          </div>
          <div class="acc-card">
            <span class="acc-side">Black</span>
            <span id="acc-b" class="acc-value">—</span>
            <div id="counts-b" class="cls-chips"></div>
          </div>
        </div>
      </div>

      <div id="move-list" class="move-list analysis"></div>

      <div id="badge-legend" class="badge-legend"></div>

      <div class="panel-section">
        <div id="eval-graph" class="eval-graph"></div>
        <div class="graph-labels"><span>black</span><span>eval per move — click to jump</span><span>white</span></div>
      </div>

      <div class="sticky-nav">
        <button id="btn-prev-sticky" title="Previous move (←)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg> Prev move</button>
        <button id="btn-next-sticky" title="Next move (→)">Next move <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></button>
      </div>

    </aside>

  </main>

  <!-- chess.js CJS shim → window.Chess -->
  <script>
    window.exports = {};
    window.module = { exports: window.exports };
  </script>
  <script src="../assets/vendor/chess.js"></script>
  <script>
    if (window.module.exports.Chess) window.Chess = window.module.exports.Chess;
    delete window.module; delete window.exports;
  </script>

  <script src="../assets/chess-app/board-ui.js"></script>
  <script src="../assets/chess-app/sounds.js"></script>
  <script src="../assets/chess-app/analysis.js"></script>

</body>
</html>
