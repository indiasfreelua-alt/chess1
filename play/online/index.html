<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.peerjs.com wss://*.peerjs.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Online — LocalChess</title>
  <link rel="stylesheet" href="../../assets/chess-app/board.css" />
  <link rel="stylesheet" href="../../assets/chess-app/online.css" />
  <link rel="icon" type="image/x-icon" href="../../assets/chess-app/favicon.ico" />
</head>
<body>

  <aside class="sidebar">
    <a class="side-logo" href="../../"><span class="brand-mark">♞</span> LocalChess</a>
    <nav class="side-nav">
      <a href="../../play/" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3.4"/><path d="M9.6 10.8 8.2 16.5h7.6l-1.4-5.7"/><path d="M6.2 20h11.6"/></svg></span> Play</a>
      <a href="../../play/online/" class="side-link active"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c.6-3 2.7-4.7 5.4-4.7s4.8 1.7 5.4 4.7"/><circle cx="17" cy="9.2" r="2.5"/><path d="M16.7 14.5c2.1.4 3.5 1.9 4 4"/></svg></span> Play Online</a>
      <a href="../../puzzles/" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h3.2a1.9 1.9 0 1 1 3.6 0H18a1 1 0 0 1 1 1v3.2a1.9 1.9 0 1 0 0 3.6V17a1 1 0 0 1-1 1h-3.2a1.9 1.9 0 1 1-3.6 0H8a1 1 0 0 1-1-1v-3.2a1.9 1.9 0 1 0 0-3.6V5a1 1 0 0 1 1-1z"/></svg></span> Puzzles</a>
      <a href="../../analysis/" class="side-link"><span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v15a1 1 0 0 0 1 1h15"/><path d="m7.5 14.5 3.5-3.5 2.5 2.5 5-5"/><path d="M15.5 8.5h3v3"/></svg></span> Analysis</a>
    </nav>
  </aside>

  <!-- ═══ Screen 1: lobby (create / join) ═══ -->
  <main id="lobby-view" class="screen play-layout">
    <section class="board-stage">
      <div id="plate-top" class="nameplate"></div>
      <div id="board-mount"></div>
      <div id="plate-bottom" class="nameplate"></div>
    </section>

    <aside class="bot-panel">
      <div class="panel-head"><span class="panel-head-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c.6-3 2.7-4.7 5.4-4.7s4.8 1.7 5.4 4.7"/><circle cx="17" cy="9.2" r="2.5"/><path d="M16.7 14.5c2.1.4 3.5 1.9 4 4"/></svg></span> Play Online</div>

      <div id="lobby-cards">
        <div class="lobby-card">
          <h4>Create a room</h4>
          <p>Get a code and share it with your friend.</p>
          <button id="btn-create" class="btn-cta wide">Create room</button>
        </div>
        <div class="lobby-card">
          <h4>Join a room</h4>
          <p>Enter the code your friend shared.</p>
          <input id="join-code" maxlength="6" autocomplete="off"
                 placeholder="CODE" spellcheck="false" />
          <button id="btn-join" class="btn-cta wide">Join</button>
        </div>
      </div>

      <div id="room-status" class="load-status"></div>

      <div id="room-panel" class="hidden">
        <div class="room-code-label">Room code</div>
        <div class="room-code-row">
          <span id="room-code" class="room-code">------</span>
          <button id="btn-copy" class="nav-btn-mini" title="Copy code" aria-label="Copy code"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
        </div>
        <div id="waiting" class="waiting-row"><span class="spinner"></span> Waiting for opponent…</div>
      </div>
    </aside>
  </main>

  <!-- ═══ Screen 2: online game ═══ -->
  <main id="game-view" class="screen play-layout">
    <section class="board-stage">
      <div id="plate-opp" class="nameplate"></div>
      <div id="board-mount-g"></div>
      <div id="plate-me" class="nameplate"></div>
    </section>

    <aside class="bot-panel">
      <div id="status" class="game-status">Connecting…</div>
      <div id="move-list" class="move-list"></div>
      <span id="conn-state" class="thinking"></span>
      <div class="panel-actions">
        <button id="btn-lobby">Leave</button>
        <button id="btn-resign" class="destructive">Resign</button>
        <button id="btn-flip">Flip</button>
      </div>
    </aside>
  </main>

  <!-- ═══ Result modal ═══ -->
  <div id="result-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="result-text">Game over</h3>
      <p id="result-sub" class="modal-sub"></p>
      <div id="result-stats" class="result-stats"></div>
      <div class="modal-actions">
        <button id="btn-analyze" class="primary">Analyze game</button>
        <button id="btn-rematch" class="hidden">Rematch</button>
        <button id="btn-result-close" class="btn-ghost">Close</button>
      </div>
    </div>
  </div>

  <!-- PeerJS 1.5.4, vendored locally so no third-party script is fetched at
       runtime. The public signaling broker still needs internet access; the
       moves themselves travel peer-to-peer over a WebRTC data channel. -->
  <script src="../../assets/chess-app/peerjs.min.js"></script>

  <!-- chess.js CJS shim → window.Chess -->
    <script src="../../assets/chess-app/shim-pre.js"></script>
  <script src="../../assets/vendor/chess.js"></script>
    <script src="../../assets/chess-app/shim-post.js"></script>

  <script src="../../assets/chess-app/board-ui.js"></script>
  <script src="../../assets/chess-app/online.js"></script>

</body>
</html>
